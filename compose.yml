services:
  postgres:
    image: postgres:16-alpine
    container_name: nomada-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nomada
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nomada"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - nomada_postgres_data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro

volumes:
  nomada_postgres_data:

